default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV["PRINTORGANIZE_USERNAME"] %>
  password: <%= ENV["PRINTORGANIZE_PASSWORD"] || ENV["PGPASSWORD"] %>
  host: localhost

development:
  primary:
    <<: *default
    database: printorganize_development
  queue:
    <<: *default
    database: printorganize_development_queue
    migrations_paths: db/queue_migrate

test:
  <<: *default
  database: printorganize_test

production:
  primary: &primary_production
    <<: *default
    database: printorganize_production
    username: <%= ENV["PRINTORGANIZE_USERNAME"] %>
    password: <%= ENV["PRINTORGANIZE_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: printorganize_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: printorganize_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: printorganize_production_cable
    migrations_paths: db/cable_migrate